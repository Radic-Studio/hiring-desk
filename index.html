<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Future Ready Group System</title>
<link rel="icon" type="image/svg+xml" href="./app/brand/app_icon.svg">
<script src="./config.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="./app/styles.css?v=9">
</head>
<body>
<div class="gate" id="gate" hidden>
  <div class="gate-wrap">
    <section class="gate-form" id="gate-card">
      <img class="lockup" src="./app/brand/lockup_horizontal_primary.svg" alt="Future Ready" width="190">
      <div class="seg" id="gate-seg" role="tablist" aria-label="Sign in or request access"><button type="button" class="on" data-mode="in" role="tab" aria-selected="true">Sign in</button><button type="button" data-mode="req" role="tab" aria-selected="false">Request access</button></div>
      <h1 id="gate-title">Welcome back</h1>
      <p class="muted" id="gate-msg"></p>
      <div id="gate-body"></div>
      <p class="hint" id="gate-note"></p>
      <p class="fine">Future Ready Nig. Ltd · Events · Press · Enugu, Nigeria</p>
    </section>
    <aside class="gate-show" id="gate-show" aria-label="Future Ready companies">
      <div class="slides" id="gate-slides"></div>
      <div class="ad" id="gate-ad" hidden><span class="chip" id="gate-ad-chip"></span><b id="gate-ad-h"></b><span id="gate-ad-p"></span></div>
      <div class="cap" id="gate-cap" hidden><h2 id="gate-cap-h"></h2><span class="pill" id="gate-cap-pill"></span></div>
      <div class="ctl" id="gate-ctl" hidden><button type="button" id="gate-prev" aria-label="Previous">&larr;</button><button type="button" id="gate-next" aria-label="Next">&rarr;</button><span class="dots" id="gate-dots"></span></div>
    </aside>
  </div>
</div>
<div class="app">
<div class="side-scrim" id="side-scrim" hidden></div>
<button class="side-toggle" id="side-toggle" aria-label="Collapse menu" title="Collapse menu"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
<aside class="side" id="side">
  <div class="brand"><img class="lockup" src="./app/brand/lockup_horizontal_primary.svg" alt="Future Ready" width="168" height="39"><img class="symbol" src="./app/brand/symbol_primary.svg" alt="Future Ready" width="30" height="30"><button class="side-close" id="side-close" aria-label="Close menu">&times;</button></div>

  <div id="company-switch" class="co-switch"></div>
  <nav class="nav" role="tablist" id="tabs"></nav>
  <div class="foot">
    <div class="pop" id="pop" hidden></div>
    <button class="me" id="me" aria-expanded="false" aria-controls="pop"><div class="avatar">·</div><div style="min-width:0"><b>Connecting…</b><small>checking your access</small></div><span class="chev">▲</span></button>
    <div class="office">Office: Udeorji Street, Obiagu, Enugu</div>
  </div>
</aside>
<div class="content">
  <div class="head">
    <button class="btn menu-btn" id="menu-btn" aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h1 id="page-title">Dashboard</h1><span class="co-badge" id="co-badge" hidden></span></div><div class="sub" id="page-sub"></div></div>
    <div class="actions">
      <span class="sync" id="sync" title="Database connection"><i></i><span>connecting</span></span>
      <button class="btn" id="act-btn" title="Activity" aria-label="Activity log"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="cnt" id="act-cnt" hidden>0</span></button>
      <button class="btn" id="dl-btn" hidden><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Download</button>
    </div>
  </div>
  <main>
    <div id="notice" hidden></div>
  </main>
  <footer class="foot-site">
    <span class="brandline"><i></i>Future Ready Nig. Ltd · Group system</span>
    <span>Udeorji Street, Obiagu, Enugu, Enugu State</span>
    <nav>
      <a href="#dashboard" data-view="dashboard">Dashboard</a>
      <a href="#candidates" data-view="candidates">Candidates</a>
      <a href="#import" data-view="import">Import a role</a>
      <a href="#" id="foot-sheet" target="_blank" rel="noopener">Google Sheet backup</a>
      <span id="foot-stamp"></span>
    </nav>
  </footer>
</div>
</div>

<div class="modal-scrim" id="dl-scrim" hidden><div class="modal" id="dl-modal" role="dialog" aria-modal="true" aria-labelledby="dl-title"></div></div>
<div class="modal-scrim" id="em-scrim" hidden><div class="modal wide" id="em-modal" role="dialog" aria-modal="true" aria-labelledby="em-title"></div></div>
<div class="modal-scrim" id="act-scrim" hidden><div class="modal" id="act-modal" role="dialog" aria-modal="true" aria-labelledby="act-title"></div></div>
<div class="modal-scrim" id="pf-scrim" hidden><div class="modal" id="pf-modal" role="dialog" aria-modal="true" aria-labelledby="pf-title"></div></div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="./app/brand/logos.js?v=9"></script>
<script src="./app/core.js?v=9"></script>
<script src="./app/modules/hiring.js?v=9"></script>
<script src="./app/modules/people.js?v=9"></script>
<script src="./app/modules/press.js?v=9"></script>
<script src="./app/shell.js?v=9"></script>
</body>
</html>
